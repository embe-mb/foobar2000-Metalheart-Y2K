<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metalheart Playlist</title>
<link rel="stylesheet" href="common.css?v=29">
<style>
  body { display: flex; flex-direction: column; background: #121921; }
  .top { flex: none; padding: 3px 4px 0; display: flex; flex-direction: column; gap: 4px; }
  .capsule { height: 26px; border-radius: 13px 13px 3px 3px; gap: 8px; }
  .capsule #plname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 40px; cursor: text; }
  .capsule .right { margin-left: auto; display: flex; gap: 4px; align-items: center; position: relative; z-index: 1; flex: none; }
  .capsule .pill { height: 16px; font-size: 8.5px; text-shadow: none; }
  .search {
    height: 18px; width: 170px; border-radius: 9px; border: 1px solid var(--blue-5); padding: 0 8px 0 20px; outline: none;
    font: 11px var(--ui); color: #dfe7ef; background: #0b1016 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='10' cy='10' r='6' fill='none' stroke='%2398a4b1' stroke-width='2.5'/><path d='M15 15l6 6' stroke='%2398a4b1' stroke-width='2.5'/></svg>") 5px center/11px no-repeat;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.8);
  }
  .search:focus { border-color: var(--lime-3); box-shadow: inset 0 1px 3px rgba(0,0,0,.8), 0 0 6px var(--lime-glow); }
  .ibtn { height: 18px; padding: 0 7px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; font: 700 8.5px/1 var(--ui); letter-spacing: .05em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); border: 1px solid var(--blue-5);
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.06) 50%, transparent 51%), linear-gradient(180deg, #4b5562, #232a33); }
  .ibtn:hover { filter: brightness(1.2); }
  .ibtn.on { color: rgb(var(--c0b1c01)); text-shadow: none; background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.1) 50%, transparent 51%), linear-gradient(180deg, var(--lime-1), var(--lime-3)); border-color: var(--lime-4); }

  /* playlist tabs */
  .tabs { display: flex; gap: 3px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 2px 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; height: 20px; max-width: 200px; padding: 0 11px; border-radius: 10px 10px 2px 2px; display: flex; align-items: center; gap: 5px; cursor: pointer;
    font: 700 10.5px/1 var(--ui); color: #b8c3cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(180deg, #2f3943, #1a2129); border: 1px solid #070a0d; border-bottom: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
  .tab:hover { color: #fff; }
  .tab.active { color: rgb(var(--c0d1f02)); background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 50%, transparent 51%), linear-gradient(180deg, var(--lime-1), var(--lime-3)); border-color: var(--lime-4); box-shadow: 0 0 8px rgba(var(--c9cff2e),.35); }
  .tab .np { width: 0; height: 0; border-left: 6px solid currentColor; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
  .tab.add { padding: 0 9px; font-size: 13px; }
  /* close button: shown on the open tab and on hover; a playlist that isn't saved asks once ("CLOSE?") */
  .tab { position: relative; }
  .tab .x { flex: none; width: 13px; height: 13px; margin-right: -5px; border-radius: 7px; display: grid; place-items: center; font: 700 8px/1 var(--ui); opacity: 0; transition: opacity .12s; }
  .tab:hover .x, .tab.active .x { opacity: .55; }
  .tab .x:hover { opacity: 1; background: rgba(0,0,0,.3); }
  .tab.arm { color: #fff; background: linear-gradient(180deg, #d4532f, #7e2412); border-color: #3a0c03; box-shadow: none; }
  .tab.arm .x { width: auto; padding: 0 5px; opacity: 1; font: 400 7px/13px var(--pixel); letter-spacing: .08em; background: rgba(0,0,0,.3); }
  .tab input { width: 120px; height: 15px; font: 700 10.5px var(--ui); border: none; outline: none; background: #0b1016; color: #fff; border-radius: 3px; padding: 0 4px; }

  /* list */
  .cols, .row { display: grid; grid-template-columns: 24px 40px minmax(120px, 3fr) minmax(70px, 2fr) 46px 92px 40px 52px; align-items: center; column-gap: 8px; padding: 0 10px 0 6px; }
  .cols { flex: none; height: 22px; font: 400 8px/1 var(--pixel); letter-spacing: .1em; color: var(--blue-1); background: linear-gradient(180deg, #1d2631, #121921); border-top: 1px solid #000; border-bottom: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
  .cols span:nth-child(n+5), .row span:nth-child(n+5), .cols span:nth-child(2) { text-align: right; }
  .viewport { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; outline: none; }
  .spacer { position: relative; }
  .row { position: absolute; left: 0; right: 0; height: 24px; font: 12px/24px var(--ui); color: #c8d2dc; cursor: default; border-left: 2px solid transparent; }
  .row span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.odd { background: #161e27; }
  .row:hover { background: #1c2733; }
  .row.sel { background: linear-gradient(180deg, var(--sel-0), var(--sel-1)); color: #fff; }
  .row.focus { border-left-color: var(--lime-2); box-shadow: inset 0 0 0 1px rgba(var(--c9cff2e),.45); }
  .row.playing { color: rgb(var(--cd6ff9e)); background: linear-gradient(90deg, rgba(var(--c5fc410),.28), rgba(var(--c192c0c),.55) 40%, rgba(var(--c192c0c),.35)); text-shadow: 0 0 6px rgba(var(--c9cff2e),.4); }
  .row.playing.sel { background: linear-gradient(180deg, rgb(var(--c4f8f1d)), rgb(var(--c346e0e))); color: #fff; }
  .row .n { color: #7d8a99; text-align: right; font-size: 11px; }
  .row.sel .n, .row.playing .n { color: inherit; }
  .row .a, .row .q { color: #8e9aa8; font-size: 11.5px; }
  .row.sel .a, .row.sel .q { color: #dbe7f3; }
  .row .ind { text-align: center; color: var(--lime-2); }
  .eq { display: inline-flex; gap: 1px; align-items: flex-end; height: 10px; }
  .eq i { width: 2px; background: var(--lime-2); box-shadow: 0 0 3px var(--lime-glow); animation: eq .8s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.3s; } .eq i:nth-child(3) { animation-delay: -.55s; }
  @keyframes eq { from { height: 2px; } to { height: 10px; } }
  body.paused .eq i { animation-play-state: paused; }

  .grp { position: absolute; left: 0; right: 0; height: 58px; display: grid; grid-template-columns: 50px 1fr auto; gap: 10px; align-items: center; padding: 6px 12px 4px 8px; cursor: default;
    background: linear-gradient(180deg, #202b37, #17202a); border-top: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,.07); }
  .grp .cv { width: 48px; height: 48px; border-radius: 4px; background: #0b0e11 center/cover no-repeat; box-shadow: 0 0 0 1px #000, 0 0 0 2px rgba(197,205,214,.25), 0 3px 6px rgba(0,0,0,.6); position: relative; overflow: hidden; }
  .grp .cv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.04) 48%, transparent 49%); }
  .grp .t1 { font: 700 13px/1.25 var(--ui); color: #eaf1f8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grp .t1 b { color: var(--lime-1); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; font-size: 11.5px; }
  .grp .t1 .sep { color: var(--blue-1); margin: 0 6px; }
  .alink { cursor: pointer; }
  .alink:hover { text-decoration: underline; }
  .grp .t2 { font: 11px/1.4 var(--ui); color: #8e9aa8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 8px; align-items: center; }
  .grp .t2 .flag { height: 10px; }
  .grp .yr { font: 700 15px/1 var(--seg); color: var(--lcd-fg); text-shadow: 0 0 6px var(--lime-glow); padding: 4px 6px 3px; border-radius: 4px; background: rgba(0,0,0,.35); border: 1px solid rgba(var(--c9cff2e),.2); }
  .grp:hover { background: linear-gradient(180deg, #263342, #1a2430); }

  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--text-dim); font: 400 8px/1.8 var(--pixel); letter-spacing: .12em; }
  .empty b { display: block; font: 900 22px/1.3 var(--display); color: var(--chrome-4); letter-spacing: .05em; }
  .empty .ibtn { margin: 10px 3px 0; }

  /* context menu */
  .menu { position: fixed; z-index: 50; min-width: 190px; padding: 4px; border-radius: 8px; background: linear-gradient(180deg, #2a343f, #161d25); border: 1px solid #000; box-shadow: 0 8px 22px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12); }
  .menu div { padding: 5px 12px; border-radius: 5px; font: 12px var(--ui); color: #dbe4ee; cursor: pointer; white-space: nowrap; }
  .menu div:hover { background: linear-gradient(180deg, var(--sel-0), var(--sel-1)); color: #fff; }
  .menu hr { border: none; border-top: 1px solid rgba(255,255,255,.08); margin: 3px 4px; }
  .menu { max-height: calc(100vh - 8px); overflow-y: auto; max-width: 300px; }
  .menu div { overflow: hidden; text-overflow: ellipsis; }
  .menu div.sub { position: relative; padding-right: 26px; }
  .menu div.sub::after { content: "▸"; position: absolute; right: 10px; color: var(--blue-1); }
  .menu div.sub.open { background: linear-gradient(180deg, var(--sel-0), var(--sel-1)); color: #fff; }
  .menu div.head { cursor: default; padding: 6px 12px 3px; font: 400 7.5px/1 var(--pixel); letter-spacing: .12em; color: var(--blue-1); }
  .menu div.head:hover { background: none; color: var(--blue-1); }
  .menu div.off { cursor: default; color: #6d7a88; }
  .menu div.off:hover { background: none; color: #6d7a88; }
  /* a short confirmation at the bottom of the panel ("ADDED 3 → Late Night") */
  .toast { position: fixed; left: 50%; bottom: 12px; z-index: 45; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 6px 14px; border-radius: 12px; pointer-events: none;
    font: 400 8px/1.4 var(--pixel); letter-spacing: .08em; color: var(--lime-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    background: linear-gradient(180deg, #2a343f, #161d25); border: 1px solid #000; box-shadow: 0 6px 18px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12); transition: opacity .25s; }
  .toast.bad { color: #ff8a7a; }
  .toast[hidden] { display: block; opacity: 0; }
</style>
</head>
<body>
<div class="top">
  <div class="capsule"><span class="orb"></span><span id="plname">Playlist</span>
    <span class="right">
      <span id="meta"></span>
      <input class="search" id="q" placeholder="Filter playlist…" spellcheck="false">
      <span class="ibtn on" id="follow" title="Keep the playing track in view">FOLLOW</span>
      <span class="ibtn" id="savedpl" title="Your saved playlists">SAVED</span>
      <span class="ibtn" data-cmd="Search" title="Search the media library (results open as a playlist)">SEARCH</span>
      <span class="ibtn" data-cmd="Configure" title="Choose the music folders of your media library">+ MUSIC</span>
    </span>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<div class="cols"><span></span><span>#</span><span>TITLE</span><span>ARTIST</span><span>YEAR</span><span>QUALITY</span><span>PLAYS</span><span>TIME</span></div>
<div class="viewport" id="vp" tabindex="0"><div class="spacer" id="sp"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="common.js?v=29"></script><script>Y2K.scopeAccent(document.body, 2); /* MULTI album colours: accent channel 2 */</script>
<script>
'use strict';
const { H, esc, safe } = Y2K;
const $ = (id) => document.getElementById(id);
const SEPC = String.fromCharCode(30);
const RH = 24, GH = 58;

const F = ['$if2(%album artist%,%artist%)', '%album%', "$year($if3($meta(originaldate),%date%,))", '%title%', '%artist%',
  '%tracknumber%', '%discnumber%', '%totaldiscs%', '%length%', '%length_seconds%',
  "$if($stricmp($info(encoding),lossless),%codec% $info(bitspersample)/$replace($div(%samplerate%,1000).$left($mod(%samplerate%,1000),1),.0,),%codec%[ %bitrate%k])",
  '%play_count%', '%path%', '%subsong%', '$directory_path(%path%)', "$meta(label,0)", '$meta(releasecountry)', '%date%'];
const SCRIPT = F.map((x) => '[' + x + ']').join('$char(30)');

let pl = -1, items = [], rows = [], tops = [], total = 0, filter = '';
let lastPl = -1, focus = -1, anchor = -1, follow = true, nowKey = '', playingIdx = new Set();
const selCache = new Map();

/* ------------------------------------------------ data */
function load(keepScroll) {
  pl = safe(() => H.activePlaylist, -1);
  const cnt = safe(() => H.playlistCount, 0);
  if (pl < 0 && cnt > 0) { pl = Math.min(lastPl < 0 ? 0 : lastPl, cnt - 1); safe(() => { H.activePlaylist = pl; }); }
  lastPl = pl;
  items = [];
  if (pl >= 0) {
    const l = safe(() => H.getPlaylistItemHandles(pl), 0);
    if (l) {
      const raw = safe(() => JSON.parse(H.formatMetaDBHandleList(l, SCRIPT)), []);
      safe(() => H.releaseMetaDBHandleList(l));
      items = raw.map((s, i) => {
        const v = s.split(SEPC);
        return { i, aa: v[0], album: v[1], year: v[2], title: v[3], artist: v[4], trk: v[5], disc: v[6], tdisc: v[7], len: v[8], lens: +v[9] || 0,
          q: v[10], plays: v[11], path: v[12], sub: v[13], dir: v[14], label: Y2K.clean(v[15]), cc: v[16], date: v[17],
          gkey: (v[0] + '|' + v[1] + '|' + v[2] + '|' + (+v[7] > 1 ? v[6] : '')).toLowerCase(), lc: (v[3] + ' ' + v[4] + ' ' + v[0] + ' ' + v[1]).toLowerCase() };
      });
    }
  }
  selCache.clear();
  focus = pl >= 0 ? safe(() => H.getFocusedPlaylistItem(pl), -1) : -1;
  buildRows();
  if (!keepScroll) $('vp').scrollTop = 0;
  updatePlaying(true);
  header();
  render();
}

function buildRows() {
  rows = []; tops = []; total = 0;
  const f = filter.toLowerCase().trim();
  let g = null;
  for (const it of items) {
    if (f && !it.lc.includes(f)) continue;
    if (!g || g.key !== it.gkey) {
      g = { key: it.gkey, aa: it.aa, album: it.album, year: it.year, dir: it.dir, label: it.label, cc: it.cc, q: it.q, disc: +it.tdisc > 1 ? it.disc : '', first: it.i, n: 0, secs: 0, members: [] };
      rows.push({ g }); tops.push(total); total += GH;
    }
    g.n++; g.secs += it.lens; g.members.push(it.i);
    rows.push({ it }); tops.push(total); total += RH;
  }
  $('sp').style.height = total + 'px';
}

function header() {
  const name = pl >= 0 ? safe(() => H.getPlaylistName(pl), 'Playlist') : 'No playlist';
  $('plname').textContent = name;
  const secs = items.reduce((s, x) => s + x.lens, 0);
  const onAir = safe(() => H.isPlaying, false) && safe(() => H.playingPlaylist, -2) === pl;
  $('meta').innerHTML = (onAir ? '<span class="pill lime"><span class="dot"></span>ON AIR</span> ' : '') +
    '<span class="pill dark">' + items.length.toLocaleString() + ' TRACK' + (items.length === 1 ? '' : 'S') + '</span> <span class="pill dark">' + dur(secs) + '</span>';
  tabs();
}
const dur = (s) => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return h ? h + 'h ' + String(m).padStart(2, '0') + 'm' : m + 'm ' + String(s % 60).padStart(2, '0') + 's'; };

/* ------------------------------------------------ playlist tabs */
function tabs() {
  const n = safe(() => H.playlistCount, 0), playing = safe(() => H.isPlaying, false) ? safe(() => H.playingPlaylist, -1) : -1;
  let h = '';
  for (let i = 0; i < n; i++) {
    const name = safe(() => H.getPlaylistName(i)), arm = closeArm && closeArm.i === i && closeArm.name === name;
    if (!Y2K.isArtPl(name)) h += '<div class="tab' + (i === pl ? ' active' : '') + (arm ? ' arm' : '') + '" data-i="' + i + '" title="' + esc(name) + '">' + (i === playing ? '<span class="np"></span>' : '') + esc(name) +
      '<span class="x" title="' + (arm ? 'Not saved: click again to close it (right-click a tab > Save playlist… keeps it)' : 'Close this playlist') + '">' + (arm ? 'CLOSE?' : '✕') + '</span></div>';
  }
  h += '<div class="tab add" id="newpl" title="New playlist">+</div>';
  $('tabs').innerHTML = h;
  $('tabs').querySelectorAll('.tab[data-i]').forEach((t) => {
    const i = +t.dataset.i;
    t.onclick = (e) => { if (e.target.closest('.x')) { e.stopPropagation(); closePl(i); return; } safe(() => { H.activePlaylist = i; }); };
    t.ondblclick = (e) => { if (!e.target.closest('.x')) rename(t, i); };
    t.oncontextmenu = (e) => { e.preventDefault(); menu(e.clientX, e.clientY, [
      ['Rename', () => rename(t, i)],
      ['Duplicate', () => safe(() => H.duplicatePlaylist(i, freshName(safe(() => H.getPlaylistName(i)) + ' (copy)')))],
      ['Save playlist…', () => openShelf(i, true)],
      ['New playlist', newPlaylist], null,
      ['Close playlist', () => closePl(i)],
    ]); };
    t.onauxclick = (e) => { if (e.button === 1) closePl(i); };
  });
  $('newpl').onclick = newPlaylist;
  const act = $('tabs').querySelector('.tab.active'); if (act) act.scrollIntoView({ inline: 'nearest' });
}
function deletePl(i) { lastPl = Math.max(0, i - 1); safe(() => H.deletePlaylist(i)); setTimeout(() => load(false), 120); }
/* Close a playlist (✕ on its tab, middle-click, or the tab menu). One with songs that isn't on the saved shelf (by
   name) asks first: its tab turns red with CLOSE? for 4 s, and a second click closes it. Library Selection is a
   scratch list the Media Library refills, so it never asks. */
let closeArm = null, closeArmT = 0;   // { i, name }
function closePl(i) {
  const name = safe(() => H.getPlaylistName(i), ''), count = safe(() => H.getPlaylistItemCount(i), 0);
  const armed = closeArm && closeArm.i === i && closeArm.name === name;
  const saved = shelfList.some((r) => r.name.trim().toLowerCase() === name.trim().toLowerCase());
  clearTimeout(closeArmT); closeArm = null;
  if (armed || !count || saved || name === 'Library Selection') { deletePl(i); return; }
  closeArm = { i, name };
  closeArmT = setTimeout(() => { closeArm = null; tabs(); }, 4000);
  tabs();
  toast('“' + name + '” ISN\'T SAVED · CLICK CLOSE? TO CLOSE IT ANYWAY', true);
}
function newPlaylist() { const i = safe(() => H.createPlaylist(H.playlistCount, freshName()), -1); if (i >= 0) { setWork(i); safe(() => { H.activePlaylist = i; }); } setTimeout(() => { const t = $('tabs').querySelector('.tab[data-i="' + i + '"]'); if (t) rename(t, i); }, 150); }
/* A playlist named like a saved one is linked to it (and writes into it), so a new playlist never takes a name that
   is saved or open already: New Playlist, New Playlist (2), ... */
function freshName(base = 'New Playlist') {
  const taken = (s) => safe(() => H.findPlaylist(s), -1) >= 0 || !!savedByName(s);
  if (!taken(base)) return base;
  for (let k = 2; ; k++) if (!taken(base + ' (' + k + ')')) return base + ' (' + k + ')';
}
function rename(tabEl, i) {
  const old = safe(() => H.getPlaylistName(i));
  tabEl.innerHTML = '<input value="' + esc(old) + '">';
  const inp = tabEl.querySelector('input'); inp.focus(); inp.select();
  let finished = false;
  const done = (ok) => {
    if (finished) return; finished = true;
    const v = inp.value.trim(), linked = savedByName(old), other = savedByName(v);
    if (ok && v && v !== old) {
      // taking a saved playlist's name would link this one to it and overwrite it on the next change
      if (other && other !== linked) { toast('“' + v + '” IS A SAVED PLAYLIST\'S NAME · PICK ANOTHER', true); tabs(); header(); return; }
      if (linked && v.toLowerCase() === 'library selection') { toast('PICK ANOTHER NAME', true); tabs(); header(); return; }
      const w = workIndex();
      safe(() => H.setPlaylistName(i, v));
      if (w === i) setWork(i);
      if (linked) {   // the saved playlist follows its tab's new name
        if (Y2K.noSync.delete(old.trim().toLowerCase())) Y2K.noSync.add(v.toLowerCase());
        linked.name = v; Y2K.savedDb.put(linked).then(refreshShelf);
      }
    }
    tabs(); header();
  };
  inp.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter') done(true); if (e.key === 'Escape') done(false); };
  inp.onblur = () => done(true);
  inp.onclick = (e) => e.stopPropagation();
}

/* ------------------------------------------------ rendering (virtualised) */
let renderQueued = false;
function render() { if (!renderQueued) { renderQueued = true; requestAnimationFrame(doRender); } }
function isSel(i) { if (!selCache.has(i)) selCache.set(i, !!safe(() => H.isPlaylistItemSelected(pl, i), false)); return selCache.get(i); }
function rowAt(y) { let lo = 0, hi = tops.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (tops[m] <= y) lo = m; else hi = m - 1; } return lo; }
function doRender() {
  renderQueued = false;
  const vp = $('vp'), sp = $('sp');
  if (!rows.length) {
    sp.innerHTML = '<div class="empty"><div><b>' + (filter ? 'NO MATCHES' : 'EMPTY PLAYLIST') + '</b>' + (filter ? 'Nothing matches “' + esc(filter) + '”' : 'Double-click an album in the Media Library panel,<br>or use File &gt; Add files / Add folder in the menu bar<br><span class="ibtn" data-cmd="Configure">+ MUSIC FOLDERS</span>') + '</div></div>';
    wireCmds(sp); return;
  }
  const y0 = vp.scrollTop, y1 = y0 + vp.clientHeight;
  let a = Math.max(0, rowAt(y0) - 6), b = Math.min(rows.length - 1, rowAt(y1) + 6);
  let h = '';
  for (let r = a; r <= b; r++) {
    const row = rows[r], top = tops[r];
    if (row.g) {
      const g = row.g;

/* ------------------------------------------------ selection & focus */
function visibleIndices() { return rows.filter((r) => r.it).map((r) => r.it.i); }
function setFocus(i, ensure = true) {

  render();
}
function ensureVisible(i) {
  const r = rows.findIndex((x) => x.it && x.it.i === i); if (r < 0) return;
  const vp = $('vp'), top = tops[r];
  const gTop = r > 0 && rows[r - 1].g ? tops[r - 1] : top;

}
function selectOnly(list) {

  for (const it of items) if (!selCache.has(it.i)) selCache.set(it.i, false);
}
function toggle(i) { const s = isSel(i); safe(() => s ? H.deselectPlaylistItem(pl, i) : H.selectPlaylistItem(pl, i)); selCache.set(i, !s); }
function rangeSel(a, b) {
  const vis = visibleIndices(), ia = vis.indexOf(a), ib = vis.indexOf(b);

// Double-clicks are detected on the second press (e.detail === 2): the first press re-renders

let lastDown = { i: -1, t: 0 };
const playItem = (i) => { safe(() => { if (H.activePlaylist !== pl) H.activePlaylist = pl; }); safe(() => H.executePlaylistDefaultAction(pl, i)); };
$('sp').addEventListener('mousedown', (e) => {
  $('vp').focus();

  const hit = rowEl ? +rowEl.dataset.i : grpEl ? rows[+grpEl.dataset.g].g.first : -1;
  if (e.button === 0 && e.detail >= 2 && !e.shiftKey && !e.ctrlKey && hit >= 0 && hit === lastDown.i && Date.now() - lastDown.t < 700) {
    lastDown = { i: -1, t: 0 }; e.preventDefault(); playItem(hit); return;
  }
  lastDown = { i: hit, t: Date.now() };
  if (rowEl) {
    const i = +rowEl.dataset.i;

$('vp').addEventListener('keydown', (e) => {
  const vis = visibleIndices(); if (!vis.length) return;
  let k = vis.indexOf(focus); const page = Math.max(1, Math.floor($('vp').clientHeight / RH) - 2);
  const move = (to) => { to = Math.max(0, Math.min(vis.length - 1, to)); const i = vis[to]; if (e.shiftKey) rangeSel(anchor >= 0 ? anchor : i, i); else { selectOnly([i]); anchor = i; } setFocus(i); e.preventDefault(); };
  switch (e.key) {
    case 'ArrowDown': move(k + 1); break;
    case 'ArrowUp': move(k - 1); break;
    case 'PageDown': move(k + page); break;
    case 'PageUp': move(k - page); break;
    case 'Home': move(0); break;
    case 'End': move(vis.length - 1); break;
    case 'Enter': if (focus >= 0) playItem(focus); e.preventDefault(); break;
    case 'Delete': removeSelected(); e.preventDefault(); break;
    case 'a': case 'A': if (e.ctrlKey) { selectOnly(vis); render(); e.preventDefault(); } break;
    case 'f': case 'F': if (e.ctrlKey) { $('q').focus(); e.preventDefault(); } break;
  }
});

/* ------------------------------------------------ context menu
   entries: [text, fn] | [text, [entries]] (a submenu, opens on hover) | 'TEXT' (a section label) | [text] (greyed) | null (line) */
let menuEl = null, subEl = null;
function buildMenu(entries, isSub) {
  const el = document.createElement('div'); el.className = 'menu';
  for (const en of entries) {
    if (!en) { el.appendChild(document.createElement('hr')); continue; }
    const d = document.createElement('div');
    if (typeof en === 'string') { d.className = 'head'; d.textContent = en; el.appendChild(d); continue; }
    d.textContent = en[0];
    if (Array.isArray(en[1])) { d.className = 'sub'; d.onmouseenter = d.onclick = () => openSub(d, en[1]); }
    else if (en[1]) { d.onclick = () => { closeMenu(); en[1](); }; if (!isSub) d.onmouseenter = closeSub; }
    else d.className = 'off';
    if (en[2]) d.title = en[2];
    el.appendChild(d);
  }
  document.body.appendChild(el);
  return el;
}
function menu(x, y, entries) {
  closeMenu();
  menuEl = buildMenu(entries);
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(4, Math.min(x, innerWidth - r.width - 4)) + 'px'; menuEl.style.top = Math.max(4, Math.min(y, innerHeight - r.height - 4)) + 'px';
}
function openSub(d, entries) {
  if (d.classList.contains('open') && subEl) return;
  closeSub(); d.classList.add('open');
  subEl = buildMenu(entries, true);
  const a = d.getBoundingClientRect(), r = subEl.getBoundingClientRect();
  const left = a.right + 2 + r.width <= innerWidth - 4 ? a.right + 2 : Math.max(4, a.left - r.width - 2);   // right of the item, else left
  subEl.style.left = left + 'px'; subEl.style.top = Math.max(4, Math.min(a.top - 4, innerHeight - r.height - 4)) + 'px';
}
function closeSub() { if (subEl) { subEl.remove(); subEl = null; } if (menuEl) menuEl.querySelectorAll('.sub.open').forEach((x) => x.classList.remove('open')); }
function closeMenu() { closeSub(); if (menuEl) { menuEl.remove(); menuEl = null; } }
document.addEventListener('mousedown', (e) => { if (menuEl && !menuEl.contains(e.target) && !(subEl && subEl.contains(e.target))) closeMenu(); });

let toastT = 0;
function toast(text, bad) { const t = $('toast'); t.textContent = text; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

/* "New Playlist" you're filling: Send to new playlist (or the + tab) makes one and you stay where you are; from then
   on "Add to “…”" keeps adding to that same playlist. Remembered as { i, name } in 'pl:work'; the index is checked
   against the name, so deleting or reordering playlists doesn't send songs to the wrong one. */
let work = safe(() => JSON.parse(localStorage.getItem('pl:work')), null);
function setWork(i) { work = { i, name: safe(() => H.getPlaylistName(i), '') }; safe(() => localStorage.setItem('pl:work', JSON.stringify(work))); }
function workIndex() {
  if (!work) return -1;
  if (safe(() => H.getPlaylistName(work.i), null) === work.name) return work.i;
  const j = safe(() => H.findPlaylist(work.name), -1);
  if (j >= 0) { work.i = j; safe(() => localStorage.setItem('pl:work', JSON.stringify(work))); return j; }
  work = null; safe(() => localStorage.removeItem('pl:work'));

}
const songWord = (n) => n + (n === 1 ? ' SONG' : ' SONGS');
function sendToNew(sel) {

  setWork(n);

}

/* Add to playlist ▸ : the saved playlists (Y2K's shelf) and, with a Navidrome server, its playlists. A saved playlist
   gets the songs with their tags (and a foobar2000 playlist of the same name, when one is open, gets them too); a
   server playlist gets the songs that come from that server. Both lists are read ahead, so the menu opens at once. */
let shelfList = [], ndPls = [];
const refreshShelf = () => Y2K.savedDb.list().then((l) => { shelfList = l; }).catch(() => {});
const refreshNdPls = () => { const c = Y2K.ndCfg(); if (!c) { ndPls = []; return; } Y2K.ndPlaylists().then((l) => { ndPls = l.filter((p) => !p.owner || p.owner === c.user); }).catch(() => {}); };
async function addToSaved(rec, sel) {
  try {
    // its tab is open (and writing back): the songs go in there and reach the saved one through the sync;
    // otherwise straight into the saved one
    const fi = safe(() => H.findPlaylist(rec.name), -1);
    if (fi >= 0 && !Y2K.noSync.has(rec.name.trim().toLowerCase())) Y2K.addPaths(fi, sel.map((i) => items[i].path));
    else {
      await Y2K.appendSaved(rec.id, shelfTracksOf(sel.map((i) => items[i])));
      if (fi >= 0) Y2K.addPaths(fi, sel.map((i) => items[i].path));
    }
    toast('ADDED ' + songWord(sel.length) + ' → “' + rec.name + '”');
  } catch (e) { toast(String(e.message || e).toUpperCase(), true); }
  refreshShelf();
}

/* ------------------------------------------------ saved playlists <-> their tabs
   A playlist named like a saved one writes every change (added, removed, moved songs) into it, a moment after the
   last change (the theme adds songs one by one). Y2K.syncHold: being filled by the theme; Y2K.noSync: opened with
   songs missing, so it must not shrink the saved copy. */
const lcName = (s) => String(s || '').trim().toLowerCase();
const savedByName = (s) => shelfList.find((r) => lcName(r.name) === lcName(s));
const syncTimers = new Map();
function scheduleSync(k) {
  const name = safe(() => H.getPlaylistName(k), '');
  if (!name || lcName(name) === 'library selection' || Y2K.isArtPl(name)) return;
  const key = lcName(name);
  clearTimeout(syncTimers.get(key));
  syncTimers.set(key, setTimeout(() => { syncTimers.delete(key); syncLinked(k, name); }, 900));
}
async function syncLinked(k, name) {
  const key = lcName(name);
  if (Y2K.syncHold.has(key) || Y2K.noSync.has(key)) return;
  if (safe(() => H.getPlaylistName(k), '') !== name) k = safe(() => H.findPlaylist(name), -1);
  if (k < 0) return;
  const rec = (await Y2K.savedDb.list().catch(() => [])).find((r) => lcName(r.name) === key);
  if (!rec) return;
  const tracks = shelfTracks(k);
  if (tracks.length === rec.tracks.length && tracks.every((t, j) => t.p === rec.tracks[j].p && (t.s || '') === (rec.tracks[j].s || ''))) return;
  rec.tracks = tracks; rec.n = tracks.length; rec.secs = tracks.reduce((s, t) => s + (t.ls || 0), 0); rec.updated = Date.now();
  await Y2K.savedDb.put(rec);
  refreshShelf();
}
/** Fill playlist n with paths after emptying it (clearing is asynchronous too); held from syncing throughout. */
function refill(n, paths, then) {
  const key = lcName(safe(() => H.getPlaylistName(n), ''));
  Y2K.syncHold.add(key);
  safe(() => H.clearPlaylist(n));
  const t0 = Date.now();
  const wait = () => {
    if (safe(() => H.getPlaylistItemCount(n), 0) && Date.now() - t0 < 4000) { setTimeout(wait, 10); return; }
    Y2K.fillPlaylist(n, paths, then);
  };
  wait();
}
/** After a save: the saved playlist gets its own tab (the one saved from, renamed, or a new one) to keep editing in. */
function linkTab(rec, replaced, fromTab) {
  const paths = rec.tracks.map((t) => t.p);
  let n = safe(() => H.findPlaylist(rec.name), -1);
  if (n >= 0 && n === fromTab) return;
  if (n < 0 && fromTab >= 0) {   // Save playlist… under a new name: that tab takes the name
    Y2K.syncHold.add(lcName(rec.name));
    const w = workIndex();
    safe(() => H.setPlaylistName(fromTab, rec.name));
    if (w === fromTab) setWork(fromTab);
    setTimeout(() => Y2K.syncHold.delete(lcName(rec.name)), 1200);
    return;
  }
  if (n >= 0) { refill(n, paths); return; }   // REPLACE of a saved playlist whose tab is open: it gets the new songs
  n = safe(() => H.createPlaylist(H.playlistCount, rec.name), -1);
  if (n < 0) return;
  Y2K.fillPlaylist(n, paths);
  setWork(n);
  toast('“' + rec.name + '” SAVED · ITS TAB SAVES YOUR CHANGES · RIGHT-CLICK SONGS TO ADD MORE');
}
async function addToNd(p, sel) {
  const ids = sel.map((i) => Y2K.ndSongId(items[i].path)).filter(Boolean), skipped = sel.length - ids.length;
  if (!ids.length) { toast('NONE OF THESE SONGS ARE ON YOUR NAVIDROME SERVER', true); return; }
  try {
    await Y2K.ndAddToPlaylist(p.id, ids);
    toast('ADDED ' + songWord(ids.length) + ' → NAVIDROME “' + p.name + '”' + (skipped ? ' · ' + skipped + ' NOT ON THE SERVER' : ''));
  } catch (e) { toast('NAVIDROME: ' + String(e.name === 'TypeError' || e.name === 'AbortError' ? 'can\'t reach the server' : e.message || e).toUpperCase(), true); }
  refreshNdPls();
}
function playlistTargets(sel) {
  const out = [['＋ New saved playlist…', () => Y2K.showSavedPlaylists({ name: '', tracks: shelfTracksOf(sel.map((i) => items[i])), onSaved: (rec, rep) => { refreshShelf().then(() => linkTab(rec, rep, -1)); } }, true),
    'Name a new playlist on the saved shelf and put these songs in it; it opens as a tab that saves your changes']];
  if (shelfList.length) out.push(null, 'SAVED PLAYLISTS', ...shelfList.map((r) => [r.name, () => addToSaved(r, sel), r.n + ' tracks on the theme\'s shelf']));
  if (Y2K.ndCfg() && ndPls.length) {
    const fromServer = sel.some((i) => Y2K.ndSongId(items[i].path));
    out.push(null, 'NAVIDROME', ...ndPls.map((p) => fromServer ? [p.name, () => addToNd(p, sel), (p.songCount || 0) + ' songs on your Navidrome server']
      : [p.name, null, 'Only songs that play from your Navidrome server can go into its playlists']));
  }
  return out;
}

/* SAVED: the theme's saved-playlist shelf (Y2K.showSavedPlaylists). Saving happens from the right-click menus:

['playback:trackChanged', 'playback:starting', 'playback:stopped', 'playback:paused'].forEach((ev) => fb2k.on(ev, Y2K.debounce(() => updatePlaying(false), 100)));
setInterval(() => updatePlaying(false), 1500);
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => e.preventDefault());
load(false);
</script>

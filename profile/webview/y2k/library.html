<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metalheart Library</title>
<link rel="stylesheet" href="common.css?v=19">
<style>
  body { display: flex; flex-direction: column; background: #121921; }
  .top { flex: none; padding: 3px 4px 4px; display: flex; flex-direction: column; gap: 5px; }
  .capsule { height: 26px; border-radius: 13px 13px 3px 3px; }
  .capsule .right { margin-left: auto; display: flex; gap: 4px; align-items: center; position: relative; z-index: 1; }
  .capsule .pill { height: 16px; font-size: 8.5px; text-shadow: none; }
  .bar { display: flex; gap: 4px; align-items: center; padding: 0 2px; }
  .views { display: flex; gap: 3px; }
  .views span { height: 19px; padding: 0 9px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center; font: 700 9px/1 var(--ui); letter-spacing: .06em; color: #b8c3cf;
    background: linear-gradient(180deg, #2f3943, #1a2129); border: 1px solid #070a0d; box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }
  .views span:hover { color: #fff; }
  .views span.on { color: rgb(var(--c0d1f02)); background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.08) 50%, transparent 51%), linear-gradient(180deg, var(--lime-1), var(--lime-3)); border-color: var(--lime-4); }
  /* albums tab: sort modes */
  .sorts { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; padding: 0 2px; }
  .sorts[hidden] { display: none; }
  .sorts span { height: 16px; padding: 0 8px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; font: 700 8.5px/1 var(--ui); letter-spacing: .06em; color: #9aa6b3;
    background: linear-gradient(180deg, #27313b, #161c23); border: 1px solid #070a0d; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); white-space: nowrap; }
  .sorts span:hover { color: #fff; }
  .sorts span.on { color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5); background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.06) 50%, transparent 51%), linear-gradient(180deg, var(--blue-2), var(--blue-4)); border-color: var(--blue-5); }
  .sorts .opt { margin-left: auto; color: var(--lime-1); background: rgba(0,0,0,.35); border-color: rgba(var(--c9cff2e),.25); box-shadow: none; }
  .sorts .opt:hover { background: rgba(var(--c9cff2e),.12); }
  .sorts .opt:empty { display: none; }
  .search { flex: 1; min-width: 60px; height: 19px; border-radius: 10px; border: 1px solid var(--blue-5); padding: 0 8px 0 20px; outline: none; font: 11px var(--ui); color: #dfe7ef;
    background: #0b1016 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='10' cy='10' r='6' fill='none' stroke='%2398a4b1' stroke-width='2.5'/><path d='M15 15l6 6' stroke='%2398a4b1' stroke-width='2.5'/></svg>") 5px center/11px no-repeat; box-shadow: inset 0 1px 3px rgba(0,0,0,.8); }
  .search:focus { border-color: var(--lime-3); box-shadow: inset 0 1px 3px rgba(0,0,0,.8), 0 0 6px var(--lime-glow); }
  .crumb { display: flex; align-items: center; gap: 6px; padding: 0 4px; min-height: 0; font: 700 11px var(--ui); color: #dbe4ee; }
  .crumb:empty { display: none; }
  .crumb .back { cursor: pointer; color: var(--lime-1); font: 400 8px/1 var(--pixel); letter-spacing: .1em; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,.35); border: 1px solid rgba(var(--c9cff2e),.25); }
  .crumb .back:hover { background: rgba(var(--c9cff2e),.12); }
  .crumb .where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .main { flex: 1; min-height: 0; display: flex; }
  .body { flex: 1; min-width: 0; position: relative; overflow-y: auto; overflow-x: hidden; padding: 4px 6px 12px; }
  /* letter / decade rail: click or drag to jump; scrolls with the wheel when the panel is short */
  .jump { flex: none; position: relative; min-width: 18px; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; padding: 4px 0 8px 3px; user-select: none; }
  .jump::-webkit-scrollbar { display: none; }
  .jump:empty { display: none; }
  .jump span { flex: 1 0 14px; max-height: 22px; display: grid; place-items: center; padding: 0 3px; border-radius: 4px; cursor: pointer; font: 400 8px/1 var(--pixel); letter-spacing: .04em; color: var(--blue-1); }
  .jump span:hover { color: #fff; background: rgba(255,255,255,.08); }
  .jump span.off { opacity: .28; }
  .jump span.on { color: rgb(var(--c0d1f02)); background: linear-gradient(180deg, var(--lime-1), var(--lime-3)); box-shadow: 0 0 6px var(--lime-glow); opacity: 1; }
  /* list views */
  .li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; height: 26px; padding: 0 8px; border-radius: 4px; cursor: pointer; font: 12px var(--ui); color: #c8d2dc; content-visibility: auto; contain-intrinsic-size: 26px; }
  .li:nth-child(odd) { background: #161e27; }
  .li:hover { background: linear-gradient(180deg, var(--sel-0), var(--sel-1)); color: #fff; }
  .li span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li .c { font: 400 8px/1 var(--pixel); color: var(--blue-1); letter-spacing: .08em; }
  .li:hover .c { color: #fff; }
  .letter { font: 900 13px/1 var(--display); color: var(--lime-2); text-shadow: 0 0 6px var(--lime-glow); padding: 10px 6px 4px; letter-spacing: .1em; }
  .grid .letter { grid-column: 1 / -1; padding: 8px 2px 0; }
  .grid .letter:first-child { padding-top: 2px; }
  /* album grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px 10px; padding-top: 4px; }
  .card { cursor: pointer; content-visibility: auto; contain-intrinsic-size: 104px 150px; min-width: 0; }
  .card .cv { aspect-ratio: 1; border-radius: 5px; background: radial-gradient(circle at 50% 35%, #2b3540, #0d1116) center/cover no-repeat; position: relative; overflow: hidden;
    box-shadow: 0 0 0 1px #000, 0 0 0 2px rgba(197,205,214,.22), 0 5px 10px rgba(0,0,0,.55); transition: transform .12s, box-shadow .12s; }
  .card .cv::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,.04) 48%, transparent 49%); }
  .card .cv .ph { position: absolute; inset: 0; display: grid; place-items: center; font: 900 28px/1 var(--display); color: #3d4753; }
  .card:hover .cv { transform: translateY(-2px); box-shadow: 0 0 0 1px #000, 0 0 0 2px var(--lime-2), 0 0 12px var(--lime-glow), 0 8px 14px rgba(0,0,0,.6); }
  .card .tt { margin-top: 6px; font: 700 11px/1.25 var(--ui); color: #e6edf4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .card .aa { font: 11px/1.3 var(--ui); color: #8e9aa8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .yy { font: 400 8px/1 var(--pixel); color: var(--blue-1); margin-top: 3px; letter-spacing: .08em; }
  .card .ed { display: inline-block; max-width: 100%; margin-top: 4px; padding: 2px 5px 1px; border-radius: 3px; font: 400 7px/1.2 var(--pixel); letter-spacing: .06em;
    text-transform: uppercase; color: rgb(var(--c0d2401)); background: var(--lime-2); box-shadow: 0 0 5px var(--lime-glow); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* album detail */
  .detail .head { display: grid; grid-template-columns: 132px 1fr; gap: 12px; padding: 8px; align-items: center; margin-bottom: 8px; }
  .detail .big { width: 132px; height: 132px; border-radius: 6px; background: radial-gradient(circle at 50% 35%, #2b3540, #0d1116) center/cover no-repeat; position: relative; overflow: hidden; box-shadow: 0 0 0 1px #000, 0 0 0 3px rgba(197,205,214,.4), 0 6px 14px rgba(0,0,0,.6); }
  .detail .big::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.26), rgba(255,255,255,.05) 48%, transparent 49%); }
  .detail .t { font: 800 15px/1.2 var(--display); color: var(--ink-0); text-shadow: 0 1px 0 var(--ink-sh); word-break: break-word; }
  .detail .a { font: 700 12px/1.3 var(--ui); color: var(--ink-1); margin-top: 3px; }
  .detail .m { font: 11px/1.4 var(--ui); color: var(--ink-2); margin-top: 3px; }
  .detail .m.ed { font: 400 8px/1.4 var(--pixel); letter-spacing: .06em; text-transform: uppercase; }
  .alink { cursor: pointer; }
  .alink:hover { text-decoration: underline; }
  /* RECORD LABEL: each label's header opens that label's releases */
  .letter.go { cursor: pointer; }
  .letter.go:hover { color: var(--lime-1); }
  .btns { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .btn { height: 21px; padding: 0 10px; border-radius: 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font: 700 9px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5);
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 50%, transparent 51%), linear-gradient(180deg, var(--blue-2), var(--blue-4)); border: 1px solid var(--blue-5); }
  .btn.lime { color: rgb(var(--c0b1c01)); text-shadow: 0 1px 0 rgba(255,255,255,.5); background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,.1) 50%, transparent 51%), linear-gradient(180deg, var(--lime-1), var(--lime-3)); border-color: var(--lime-4); }
  .btn:hover { filter: brightness(1.15); }
  .tracks .tr { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; height: 24px; align-items: center; padding: 0 8px; border-radius: 4px; font: 12px var(--ui); color: #c8d2dc; cursor: pointer; }
  .tracks .tr:nth-child(odd) { background: #161e27; }
  .tracks .tr:hover { background: linear-gradient(180deg, var(--sel-0), var(--sel-1)); color: #fff; }
  .tracks .tr .n { color: #7d8a99; text-align: right; font-size: 11px; }
  .tracks .tr span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tracks .dh { font: 400 8px/1 var(--pixel); color: var(--lime-2); letter-spacing: .12em; padding: 10px 8px 4px; }
  .empty { padding: 40px 12px; text-align: center; color: var(--text-dim); font: 400 8px/1.8 var(--pixel); letter-spacing: .12em; }
  .empty b { display: block; font: 900 20px/1.3 var(--display); color: var(--chrome-4); letter-spacing: .05em; }
  .empty .btn { margin-top: 10px; }
  .loading b { color: var(--lime-3); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .menu { position: fixed; z-index: 50; min-width: 180px; padding: 4px; border-radius: 8px; background: linear-gradient(180deg, #2a343f, #161d25); border: 1px solid #000; box-shadow: 0 8px 22px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.12); }
  .menu div { padding: 5px 12px; border-radius: 5px; font: 12px var(--ui); color: #dbe4ee; cursor: pointer; white-space: nowrap; }
  .menu div:hover { background: linear-gradient(180deg, var(--sel-0), var(--sel-1)); color: #fff; }
</style>
</head>
<body>
<div class="top">
  <div class="capsule"><span class="orb"></span>Media Library<span class="right" id="meta"></span></div>
  <div class="bar">
    <div class="views" id="views"><span data-v="artists">ARTISTS</span><span data-v="albums">ALBUMS</span><span data-v="genres">GENRES</span><span data-v="years">YEARS</span></div>
    <input class="search" id="q" placeholder="Search…" spellcheck="false">
  </div>
  <div class="sorts" id="sorts" hidden><span data-s="all">ALL</span><span data-s="year">YEAR</span><span data-s="random">RANDOM</span><span data-s="added">RECENTLY ADDED</span><span data-s="label">RECORD LABEL</span><span class="opt" id="sopt"></span></div>
  <div class="crumb" id="crumb"></div>
</div>
<div class="main"><div class="jump" id="rail"></div><div class="body" id="body"><div class="empty loading"><b>SCANNING…</b>Reading your media library</div></div></div>

<script src="common.js?v=19"></script><script>Y2K.scopeAccent(document.body, 1); /* MULTI album colours: accent channel 1 */</script>
<script>
'use strict';
const { H, esc, safe } = Y2K;
const $ = (id) => document.getElementById(id);
const SEPC = String.fromCharCode(30);
const F = ['$if2(%album artist%,%artist%)', '%album%', "$year($if3($meta(originaldate),%date%,))", "$meta(genre,0)", '%title%', '%artist%',
  '%discnumber%', '%tracknumber%', '%length_seconds%', '%length%', '%path%', '$directory_path(%path%)', "$if3($meta(label,0),$meta(publisher,0),)", '%totaldiscs%',
  // edition fields: tell different versions of the same album apart (MusicBrainz tags first, then Discogs / VGMdb ones)
  "$if3($meta(musicbrainz_albumid,0),$meta(musicbrainz album id,0),)", "$if3($meta(media,0),$meta(media type,0),$meta(mediatype,0),)", '$year(%date%)', '%codec%',
  "$if3($meta(releasecountry,0),$meta(musicbrainz album release country,0),$meta(discogs_country,0),$meta(country,0),)",
  "$if3($meta(catalognumber,0),$meta(catalog #,0),$meta(catalog,0),$meta(catalogid,0),)",
  // RECENTLY ADDED: when the track joined the library (playback statistics), else the file's date
  '$if3(%added%,%last_modified%,)'];
const SCRIPT = F.map((x) => '[' + x + ']').join('$char(30)');

let albums = [], byKey = new Map(), trackCount = 0;
/* Everything the user picks is remembered across Back clicks and restarts:
   'lib:state' = tab, album sort, year direction, shuffle seed, drill-down stack, search;
   'lib:pos'   = scroll position per screen, kept as the first visible item (+ offset) so it
                 survives resizes and library rescans. */
const saved = safe(() => JSON.parse(localStorage.getItem('lib:state')), null) || {};
let view = saved.view || safe(() => localStorage.getItem('lib:view')) || 'albums';
let sort = saved.sort || 'all';        // albums tab: all | year | random | added | label
let yearDesc = !!saved.yearDesc;       // YEAR sort: false = earliest first
let labelCat = !!saved.labelCat;       // RECORD LABEL sort: each label's releases by catalogue number (false = by date)
let seed = saved.seed || newSeed();    // RANDOM sort: same order until shuffled again
let stack = Array.isArray(saved.stack) ? saved.stack : [];   // drill-down: {type:'artist'|'genre'|'year'|'album'|'search', value}
let query = saved.query || '';
let pos = safe(() => JSON.parse(localStorage.getItem('lib:pos')), null) || {};
let rendered = false;
function newSeed() { return 1 + Math.floor(Math.random() * 2147483646); }
function saveState() { safe(() => localStorage.setItem('lib:state', JSON.stringify({ view, sort, yearDesc, labelCat, seed, stack, query }))); }
const storePos = Y2K.debounce(() => safe(() => localStorage.setItem('lib:pos', JSON.stringify(pos))), 400);

/* ------------------------------------------------ data */
function load() {
  if (rendered) savePos();
  const enabled = safe(() => H.isLibraryEnabled, true);
  const l = enabled ? safe(() => H.getLibraryItems(), 0) : 0;
  let raw = [];
  if (l) { raw = safe(() => JSON.parse(H.formatMetaDBHandleList(l, SCRIPT)), []); safe(() => H.releaseMetaDBHandleList(l)); }
  trackCount = raw.length;
  byKey = new Map();
  for (const s of raw) {
    const v = s.split(SEPC);
    // media: Discogs MEDIATYPE "CD (Album, Reissue)" -> "CD", MP3s' '12" Vinyl' kept whole (same clean-up as the deck)
    const t ={ aa: v[0] || 'Unknown artist', album: v[1] || '(no album)', year: v[2], genre: v[3], title: v[4], artist: v[5], disc: v[6], trk: v[7], secs: +v[8] || 0, len: v[9], path: v[10], dir: v[11], label: Y2K.clean(v[12]), tdisc: +v[13] || 1,
      mbid: v[14], media: Y2K.mediaLabel(v[15]) || v[15] || '', ryear: v[16], codec: v[17], country: v[18], cat: Y2K.clean(v[19]), added: v[20] || '' };
    // one card per edition: the MusicBrainz release when tagged, otherwise the album folder
    // (CD1/Disc 2 subfolders count as one), and never mixing formats (FLAC vs MP3 copies)
    const edition = t.mbid || t.year + '|' + albumDir(t.dir);
    const key = (t.aa + '|' + t.album + '|' + edition + '|' + t.codec).toLowerCase();
    let a = byKey.get(key);
    if (!a) {
      a = { key, aa: t.aa, album: t.album, year: t.year, genre: t.genre, label: t.label, dir: t.dir, tracks: [], secs: 0,
        media: t.media, ryear: t.ryear, codec: t.codec, country: t.country, cat: t.cat, added: '' };
      byKey.set(key, a);
    }
    a.tracks.push(t); a.secs += t.secs;
    if (!a.genre && t.genre) a.genre = t.genre;
    if (t.added > a.added) a.added = t.added;
  }
  albums = [...byKey.values()];
  // albums that exist in more than one version get an edition line on their cards
  const versions = new Map();
  for (const a of albums) { const k = (a.aa + '|' + a.album).toLowerCase(); versions.set(k, (versions.get(k) || 0) + 1); }
  for (const a of albums) {
    a.multi = versions.get((a.aa + '|' + a.album).toLowerCase()) > 1;
    a.edition = [a.media, a.ryear && a.ryear !== a.year ? a.ryear : '', a.country, a.codec].filter(Boolean).join(' · ');
    a.tracks.sort((x, y) => (parseInt(x.disc) || 1) - (parseInt(y.disc) || 1) || (parseInt(x.trk) || 0) - (parseInt(y.trk) || 0) || x.path.localeCompare(y.path));
    a.dir = a.tracks[0].dir;
    a.lc = (a.aa + ' ' + a.album).toLowerCase();
    a.tlc = a.tracks.map((t) => (t.title + ' ' + t.artist).toLowerCase()).join('\n');
    a.alc = [a.aa, ...new Set(a.tracks.map((t) => t.artist))].join('\n').toLowerCase();   // artist search
    a.sn = sortName(a.album);
  }
  // base order (artist, then year): used inside an artist / genre / year and for search results
  albums.sort((x, y) => byName(x.aa, y.aa) || (x.year || '9999').localeCompare(y.year || '9999') || COL.compare(x.album, y.album));
  $('meta').innerHTML = trackCount ? '<span class="pill dark">' + albums.length.toLocaleString() + ' ALBUMS</span><span class="pill dark">' + trackCount.toLocaleString() + ' TRACKS</span>' : '';
  render();
}
const sortName = (s) => (s || '').replace(/^(the|a|an)\s+/i, '').toLowerCase();
// symbols sort first, then digits, then letters (ICU order); accents fold onto their letter
const COL = new Intl.Collator(undefined, { sensitivity: 'base', numeric: true });
const letterOf = (s) => { const c = sortName(s).normalize('NFD').charAt(0).toUpperCase(); return c >= 'A' && c <= 'Z' ? c : '#'; };
// '#' (symbols, digits, other scripts) as one block on top, then A-Z
const byName = (x, y) => { const lx = letterOf(x), ly = letterOf(y); return (lx === '#' ? '' : lx).localeCompare(ly === '#' ? '' : ly) || COL.compare(sortName(x), sortName(y)); };
const LETTERS = ['#', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
function hash(s) { let h = seed >>> 0; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 2654435761) >>> 0; return (h ^ (h >>> 15)) >>> 0; }

/* ------------------------------------------------ navigation & remembered positions */
const top_ = () => stack[stack.length - 1];
// the screen currently shown; its scroll position is remembered under this key
function ctx() {
  const s = view === 'albums' && !stack.length ? sort + (sort === 'year' ? (yearDesc ? '-' : '+') : sort === 'random' ? seed : sort === 'label' ? (labelCat ? '#' : '') : '') : '';
  return [view, s, query, stack.map((x) => x.type + ':' + x.value).join('>')].join('|');
}
/** Change the screen: remember where we were, apply the change, render the new screen. */
function go(change) { savePos(); change(); saveState(); render(); }
function savePos() {
  if (!rendered) return;
  const body = $('body'), y = body.scrollTop, els = body.querySelectorAll('[data-a]');
  let lo = 0, hi = els.length - 1, k = -1;   // first item still (partly) visible
  while (lo <= hi) { const m = (lo + hi) >> 1; if (els[m].offsetTop + els[m].offsetHeight > y) { k = m; hi = m - 1; } else lo = m + 1; }
  const key = ctx();
  delete pos[key];
  pos[key] = y > 0 && k >= 0 ? { a: els[k].dataset.a, o: els[k].offsetTop - y, y } : { y };
  const ks = Object.keys(pos);
  if (ks.length > 300) ks.slice(0, ks.length - 300).forEach((x) => delete pos[x]);
  storePos();
}
let settleId = 0;
function restorePos() {
  const body = $('body'), p = pos[ctx()], id = ++settleId;
  if (!p) { body.scrollTop = 0; return; }
  const el = p.a != null && body.querySelector('[data-a="' + CSS.escape(p.a) + '"]');
  if (!el) { body.scrollTop = p.y; return; }
  // cards skip layout until near the viewport (content-visibility), so the rows around the
  // remembered card change height over the next frames: re-align until it holds still
  let n = 0;
  const fix = () => {
    if (id !== settleId || !el.isConnected) return;
    const want = el.offsetTop - p.o;
    if (Math.abs(body.scrollTop - want) > 1) body.scrollTop = want;
    if (++n < 6) requestAnimationFrame(fix); else railSync();
  };
  fix();
}

/* ------------------------------------------------ views */
function render() {
  const top = top_();
  document.querySelectorAll('#views span').forEach((s) => s.classList.toggle('on', s.dataset.v === view && !stack.length));
  const showSorts = view === 'albums' && !stack.length;
  $('sorts').hidden = !showSorts;
  if (showSorts) {
    document.querySelectorAll('#sorts span[data-s]').forEach((s) => s.classList.toggle('on', s.dataset.s === sort));
    $('sopt').textContent = sort === 'year' ? (yearDesc ? '▼ LATEST FIRST' : '▲ EARLIEST FIRST') : sort === 'random' ? '↻ SHUFFLE AGAIN'
      : sort === 'label' ? (labelCat ? '# BY CATALOGUE NO.' : '▲ BY RELEASE DATE') : '';
    $('sopt').title = sort === 'year' ? 'Switch between earliest and latest first' : sort === 'label' ? 'Order each label\'s releases by release date or by catalogue number' : 'Shuffle the albums again';
  }
  if (document.activeElement !== $('q')) $('q').value = top && top.type === 'search' ? top.value : query;
  rendered = true;
  draw();
  restorePos();
  railSync();
}
function draw() {
  const body = $('body');
  $('rail').innerHTML = '';
  if (!trackCount) {
    body.innerHTML = '<div class="empty"><b>NO MUSIC YET</b>' + 'Add your music folders and they appear here' + '<br><span class="btn lime" id="addmusic">+ ADD MUSIC FOLDERS</span></div>';
    $('addmusic').onclick = () => Y2K.runCommand('Configure');
    $('crumb').innerHTML = ''; return;
  }
  const top = top_();
  crumb();
  if (top && top.type === 'album') {
    const a = byKey.get(top.value);
    if (a) return renderAlbum(a);
    stack.pop(); saveState(); return draw();   // album gone after a rescan
  }
  let list = albums;
  if (top && top.type === 'search') return renderGrid(albums.filter(artistMatcher(top.value)));
  if (top) list = albums.filter((a) => match(a, top));
  const q = query.toLowerCase().trim();
  if (!top && view !== 'albums' && !q) return renderGroups(view);
  if (q) list = list.filter((a) => a.lc.includes(q) || a.tlc.includes(q));
  if (top && top.type === 'label') return renderGrid(list.slice().sort(releaseOrder(labelCat)));
  if (!top && view === 'albums') return renderSorted(list);
  renderGrid(list);
}
function match(a, f) {
  if (f.type === 'artist') return a.aa.toLowerCase() === f.value.toLowerCase();
  if (f.type === 'genre') return (a.genre || 'Unknown').toLowerCase() === f.value.toLowerCase();
  if (f.type === 'year') return (f.value === 'Unknown' ? !a.year : a.year === f.value);
  if (f.type === 'label') return labelKey(a.label) === labelKey(f.value);
  return true;
}
/* record labels: the same label spelt with different capitals or spaces ("Warp" / "WARP ") is one label, shown
   the way most of its releases spell it; releases are listed by date, or by catalogue number (how a label numbers
   its own discography; numbers compare as numbers, so WARP9 comes before WARP10) */
const labelKey = (s) => (s || '').trim().replace(/\s+/g, ' ').toLowerCase();
function labelNames(list) {
  const votes = new Map();
  for (const a of list) {
    const k = labelKey(a.label); if (!k) continue;
    const m = votes.get(k) || new Map(), s = a.label.trim().replace(/\s+/g, ' ');
    m.set(s, (m.get(s) || 0) + 1); votes.set(k, m);
  }
  const best = new Map([...votes].map(([k, m]) => [k, [...m].sort((x, y) => y[1] - x[1])[0][0]]));
  return (a) => best.get(labelKey(a.label)) || '';
}
const releaseOrder = (byCat) => (x, y) => (byCat ? (!x.cat) - (!y.cat) || COL.compare(x.cat || '', y.cat || '') : 0) ||
  (!x.year) - (!y.year) || (x.year || '').localeCompare(y.year || '') || COL.compare(x.cat || '', y.cat || '') || byName(x.aa, y.aa) || COL.compare(x.sn, y.sn);
function openLabel(name) {
  name = (name || '').trim(); if (!name) return;
  const top = top_();
  if (top && top.type === 'label' && labelKey(top.value) === labelKey(name)) return;
  go(() => stack.push({ type: 'label', value: name }));
}
// artist search: the name as a whole word in the album artist or any track artist ("X feat. Y", "X & Y")
function artistMatcher(name) {
  const re = new RegExp('(^|[^\\p{L}\\p{N}])' + name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^\\p{L}\\p{N}])', 'u');
  return (a) => re.test(a.alc);
}
function crumb() {
  const top = top_();
  if (!top) { $('crumb').innerHTML = query ? '<span class="where">Results for “' + esc(query) + '”</span>' : ''; return; }
  const label = { artist: 'ARTIST', genre: 'GENRE', year: 'YEAR', album: 'ALBUM', search: 'ARTIST SEARCH', label: 'RECORD LABEL' }[top.type];
  const name = top.type === 'album' ? (byKey.get(top.value) || {}).album : top.value;
  $('crumb').innerHTML = '<span class="back" id="back">◂ BACK</span><span class="where"><span style="color:var(--blue-1);font:400 8px var(--pixel);letter-spacing:.1em">' + label + '</span>&nbsp; ' + esc(name || '') + '</span>';
  $('back').onclick = back;
}
function back() { if (stack.length) go(() => stack.pop()); }
function searchArtist(name) {
  name = (name || '').trim(); if (!name) return;
  const top = top_();
  if (top && top.type === 'search' && top.value.toLowerCase() === name.toLowerCase()) return;
  go(() => stack.push({ type: 'search', value: name }));
}
function groupRow(type, k, n) {
  return '<div class="li" data-a="' + esc(k) + '" data-k="' + esc(k) + '"><span>' + esc(k) + '</span><span class="c">' + n + ' ALBUM' + (n === 1 ? '' : 'S') + '</span></div>';
}
function renderGroups(kind) {
  const counts = new Map();
  for (const a of albums) {
    const k = kind === 'artists' ? a.aa : kind === 'genres' ? (a.genre || 'Unknown') : (a.year || 'Unknown');
    counts.set(k, (counts.get(k) || 0) + 1);
  }
  let keys = [...counts.keys()];
  if (kind === 'years') keys.sort((x, y) => (x === 'Unknown') - (y === 'Unknown') || y.localeCompare(x));
  else keys.sort(byName);
  let h = '', group = null;
  for (const k of keys) {
    if (kind === 'years') { const d = k === 'Unknown' ? 'UNKNOWN' : k.slice(0, 3) + '0s'; if (d !== group) { group = d; h += '<div class="letter">' + d + '</div>'; } }
    else { const L = letterOf(k); if (L !== group) { group = L; h += '<div class="letter" data-g="' + L + '">' + L + '</div>'; } }
    h += groupRow(kind, k, counts.get(k));
  }
  $('body').innerHTML = h;
  if (kind !== 'years') buildRail(LETTERS);
  const type = { artists: 'artist', genres: 'genre', years: 'year' }[kind];
  $('body').querySelectorAll('.li').forEach((el) => { el.onclick = () => go(() => stack.push({ type, value: el.dataset.k })); });
}
/* ALBUMS tab: ALL (by title) / YEAR / RANDOM / RECENTLY ADDED, with section headers */
function renderSorted(list) {
  list = list.slice();
  let head = null, rail = null;
  if (sort === 'year') {
    const dir = yearDesc ? -1 : 1;
    list.sort((x, y) => (!x.year) - (!y.year) || dir * (x.year || '').localeCompare(y.year || '') || byName(x.aa, y.aa) || COL.compare(x.sn, y.sn));
    // a header per year, the rail jumps by decade
    head = (a) => a.year ? [a.year.slice(0, 3), a.year] : ['?', 'UNKNOWN YEAR'];
  } else if (sort === 'random') {
    const h = new Map(list.map((a) => [a, hash(a.key)]));
    list.sort((x, y) => h.get(x) - h.get(y));
  } else if (sort === 'added') {
    list.sort((x, y) => (!x.added) - (!y.added) || y.added.localeCompare(x.added) || COL.compare(x.sn, y.sn));
    head = (a) => { const m = /^(\d{4})-(\d\d)/.exec(a.added); return m ? [m[0], MONTHS[+m[2] - 1] + ' ' + m[1]] : ['?', 'DATE UNKNOWN']; };
  } else if (sort === 'label') {
    // a header per label with its release count (click it to open the label), the rail jumps by letter,
    // releases without a label tag at the end
    const name = labelNames(list), count = new Map(), within = releaseOrder(labelCat);
    for (const a of list) { const n = name(a); count.set(n, (count.get(n) || 0) + 1); }
    list.sort((x, y) => (!name(x)) - (!name(y)) || byName(name(x), name(y)) || within(x, y));
    head = (a) => { const n = name(a), c = count.get(n); return n ? [letterOf(n), n + '  ·  ' + c + (c === 1 ? ' RELEASE' : ' RELEASES'), n] : ['?', 'NO LABEL TAG']; };
    rail = list.some((a) => !name(a)) ? [...LETTERS, '?'] : LETTERS;
  } else {
    list.sort((x, y) => byName(x.album, y.album) || byName(x.aa, y.aa));
    head = (a) => { const L = letterOf(a.album); return [L, L]; };
    rail = LETTERS;
  }
  renderGrid(list, head);
  if (sort === 'year') {
    const ds = [];
    $('body').querySelectorAll('.letter[data-g]').forEach((el) => { if (!ds.includes(el.dataset.g)) ds.push(el.dataset.g); });
    buildRail(ds.map((d) => [d, d === '?' ? '?' : d.charAt(2) + '0s']));
  } else if (rail) buildRail(rail);
}
function albumDir(d) { return String(d || '').replace(/[\\/](cd|disc|disk)[ _-]?\d+[^\\/]*$/i, ''); }
function renderGrid(list, head) {
  if (!list.length) { $('body').innerHTML = '<div class="empty"><b>NOTHING FOUND</b>Try a different search</div>'; return; }
  let h = '<div class="grid">', last = null;
  // label views: the catalogue number takes the track count's place on the cards
  const top = top_(), showCat = top ? top.type === 'label' : view === 'albums' && sort === 'label';
  for (const a of list) {
    if (head) {
      const [g, label, open] = head(a);   // open: a record label the header leads to
      if (label !== last) { last = label; h += '<div class="letter' + (open ? ' go" data-open="' + esc(open) + '" title="Show only this label\'s releases' : '') + '" data-g="' + esc(g) + '">' + esc(label) + '</div>'; }
    }
    h += '<div class="card" data-a="' + esc(a.key) + '" data-k="' + esc(a.key) + '"><div class="cv" data-dir="' + esc(a.dir) + '" data-track="' + esc(a.tracks[0] ? a.tracks[0].path : '') + '"><div class="ph">' + esc((a.album || '?').charAt(0).toUpperCase()) + '</div></div>' +
      '<div class="tt">' + esc(a.album) + '</div><div class="aa">' + esc(a.aa) + '</div><div class="yy">' + esc(a.year || '----') + ' · ' + (showCat && a.cat ? esc(a.cat) : a.tracks.length + ' TRK') + '</div>' +
      (a.multi && a.edition ? '<div class="ed" title="One of several versions of this album">' + esc(a.edition) + '</div>' : '') + '</div>';
  }
  h += '</div>';
  $('body').innerHTML = h;
  const io = new IntersectionObserver((ents) => ents.forEach((en) => {
    if (!en.isIntersecting) return;
    io.unobserve(en.target);
    const el = en.target;
    Y2K.thumb(Y2K.toFwd(el.dataset.dir), 160, el.dataset.track).then((u) => { if (u) { el.style.backgroundImage = 'url("' + u + '")'; const p = el.querySelector('.ph'); if (p) p.remove(); } });
  }), { root: $('body'), rootMargin: '300px' });
  $('body').querySelectorAll('.cv[data-dir]').forEach((el) => io.observe(el));
  $('body').querySelectorAll('.letter[data-open]').forEach((el) => { el.onclick = () => openLabel(el.dataset.open); });
  $('body').querySelectorAll('.card').forEach((el) => {
    const a = byKey.get(el.dataset.k);
    el.onclick = () => go(() => stack.push({ type: 'album', value: a.key }));
    el.ondblclick = (e) => { e.stopPropagation(); Y2K.loadPaths(a.tracks.map((t) => t.path)); if (top_() && top_().type === 'album') back(); };
    el.oncontextmenu = (e) => { e.preventDefault(); albumMenu(e.clientX, e.clientY, a); };
  });
}

/* ------------------------------------------------ letter / decade rail */
// items: ['A', ...] or [[id, label], ...]; ids match the data-g of the section headers
function buildRail(items) {
  const has = new Set([...$('body').querySelectorAll('.letter[data-g]')].map((el) => el.dataset.g));
  $('rail').innerHTML = items.map((it) => { const [g, label] = Array.isArray(it) ? it : [it, it]; return '<span data-g="' + esc(g) + '"' + (has.has(g) ? '' : ' class="off"') + '>' + esc(label) + '</span>'; }).join('');
}
function railJump(g) {
  const spans = [...$('rail').children], i = spans.findIndex((s) => s.dataset.g === g);
  // an empty letter jumps to the next one that has entries (or the last one before it)
  const order = [...spans.slice(i), ...spans.slice(0, i).reverse()];
  for (const s of order) {
    const el = $('body').querySelector('.letter[data-g="' + CSS.escape(s.dataset.g) + '"]');
    if (el) { $('body').scrollTop = el.offsetTop - 2; savePos(); railSync(); return; }
  }
}
function railSync() {
  const rail = $('rail'); if (!rail.firstChild) return;
  const y = $('body').scrollTop + 8;
  let g = null;
  for (const el of $('body').querySelectorAll('.letter[data-g]')) { if (el.offsetTop <= y) g = el.dataset.g; else break; }
  let on = null;
  for (const s of rail.children) { const m = s.dataset.g === g; s.classList.toggle('on', m); if (m) on = s; }
  // keep the lit letter visible when the rail itself has to scroll
  if (on && rail.scrollHeight > rail.clientHeight) {
    if (on.offsetTop < rail.scrollTop) rail.scrollTop = on.offsetTop - 4;
    else if (on.offsetTop + on.offsetHeight > rail.scrollTop + rail.clientHeight) rail.scrollTop = on.offsetTop + on.offsetHeight - rail.clientHeight + 4;
  }
}
let railDrag = false;
$('rail').addEventListener('mousedown', (e) => { const s = e.target.closest('span[data-g]'); if (!s || e.button) return; e.preventDefault(); railDrag = true; railJump(s.dataset.g); });
$('rail').addEventListener('mousemove', (e) => { if (!railDrag || !(e.buttons & 1)) { railDrag = false; return; } const s = e.target.closest('span[data-g]'); if (s && !s.classList.contains('on')) railJump(s.dataset.g); });
document.addEventListener('mouseup', () => { railDrag = false; });

function renderAlbum(a) {
  const multi = new Set(a.tracks.map((t) => t.disc || '1')).size > 1;
  let tr = '', lastDisc = null;
  a.tracks.forEach((t, i) => {
    if (multi && t.disc !== lastDisc) { lastDisc = t.disc; tr += '<div class="dh">DISC ' + esc(t.disc || '1') + '</div>'; }
    tr += '<div class="tr" data-a="' + i + '" data-i="' + i + '"><span class="n">' + esc(t.trk) + '</span><span>' + esc(t.title) + (t.artist && t.artist !== a.aa ? ' <span style="color:#8e9aa8">— <span class="alink" data-artist="' + esc(t.artist) + '" title="Search the library for this artist">' + esc(t.artist) + '</span></span>' : '') + '</span><span class="n">' + esc(t.len) + '</span></div>';
  });
  const mins = Math.round(a.secs / 60);
  $('body').innerHTML = '<div class="detail"><div class="head chrome screws"><div class="big" id="big"></div><div style="min-width:0">' +
    '<div class="t">' + esc(a.album) + '</div><div class="a"><span class="alink" data-artist="' + esc(a.aa) + '" title="Search the library for this artist">' + esc(a.aa) + '</span></div>' +
    '<div class="m">' + [esc(a.year), a.label ? '<span class="alink" data-label="' + esc(a.label) + '" title="Show this label\'s releases">' + esc(a.label) + '</span>' : '', esc(a.genre),
      a.tracks.length + (a.tracks.length === 1 ? ' track' : ' tracks'), mins + ' min'].filter(Boolean).join(' · ') + '</div>' +
    (a.edition || a.cat ? '<div class="m ed">' + esc([a.edition, a.cat].filter(Boolean).join(' · ')) + '</div>' : '') +
    '<div class="btns"><span class="btn lime" id="bplay">▶ Play</span><span class="btn" id="badd">+ Add</span><span class="btn" id="bnew">New playlist</span><span class="btn" id="bdir">Folder</span></div>' +
    '</div></div><div class="tracks">' + tr + '</div></div>';
  Y2K.thumb(Y2K.toFwd(a.dir), 264, a.tracks[0] && a.tracks[0].path).then((u) => { const b = $('big'); if (u && b) b.style.backgroundImage = 'url("' + u + '")'; });
  const paths = a.tracks.map((t) => t.path);
  $('bplay').onclick = () => Y2K.playPaths(paths);
  $('badd').onclick = () => addToActive(paths);
  $('bnew').onclick = () => newPlaylist(a.album, paths);
  $('bdir').onclick = () => Y2K.openFile(Y2K.toFwd(a.dir));
  $('body').querySelectorAll('.tr').forEach((el) => { el.ondblclick = (e) => { if (!e.target.closest('.alink')) Y2K.loadPaths(paths, a.tracks[+el.dataset.i].path); }; el.title = 'Double-click to load into Library Selection (double-click it there to play)'; });
  $('body').querySelectorAll('.alink').forEach((el) => { el.onclick = (e) => { e.stopPropagation(); if (el.dataset.label) openLabel(el.dataset.label); else searchArtist(el.dataset.artist); }; });
}
function addToActive(paths) {
  let pl = safe(() => H.activePlaylist, -1);
  if (pl < 0) pl = Y2K.playlistIndexByName('Default', true);
  Y2K.addPaths(pl, paths);
}
function newPlaylist(name, paths) { const n = safe(() => H.createPlaylist(H.playlistCount, name), -1); if (n >= 0) { Y2K.addPaths(n, paths); safe(() => { H.activePlaylist = n; }); } }

let menuEl = null;
function albumMenu(x, y, a) {
  if (menuEl) menuEl.remove();
  const paths = a.tracks.map((t) => t.path);
  menuEl = document.createElement('div'); menuEl.className = 'menu';
  [['▶  Play', () => Y2K.playPaths(paths)], ['Add to current playlist', () => addToActive(paths)], ['Send to new playlist', () => newPlaylist(a.album, paths)],
    ['More by ' + a.aa, () => searchArtist(a.aa)], ...(a.label ? [['More on ' + a.label, () => openLabel(a.label)]] : []), ['Open folder', () => Y2K.openFile(Y2K.toFwd(a.dir))]]
    .forEach(([t, f]) => { const d = document.createElement('div'); d.textContent = t; d.onclick = () => { menuEl.remove(); menuEl = null; f(); }; menuEl.appendChild(d); });
  document.body.appendChild(menuEl);
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.min(x, innerWidth - r.width - 4) + 'px'; menuEl.style.top = Math.min(y, innerHeight - r.height - 4) + 'px';
}
document.addEventListener('mousedown', (e) => { if (menuEl && !menuEl.contains(e.target)) { menuEl.remove(); menuEl = null; } });

/* ------------------------------------------------ wiring */
document.querySelectorAll('#views span').forEach((s) => s.onclick = () => go(() => { view = s.dataset.v; stack = []; safe(() => localStorage.setItem('lib:view', view)); }));
document.querySelectorAll('#sorts span[data-s]').forEach((s) => s.onclick = () => go(() => {
  if (s.dataset.s === 'random' && sort === 'random') { seed = newSeed(); delete pos[ctx()]; }   // RANDOM again = new shuffle
  sort = s.dataset.s;
}));
$('sopt').onclick = () => go(() => {
  if (sort === 'year') yearDesc = !yearDesc;
  else if (sort === 'label') labelCat = !labelCat;
  else if (sort === 'random') seed = newSeed();
});
$('q').addEventListener('input', Y2K.debounce(() => go(() => { query = $('q').value; stack = stack.filter((s) => s.type !== 'album' && s.type !== 'search'); }), 200));
$('q').addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const top = top_();
  go(() => { if (top && top.type === 'search') stack.pop(); else query = ''; });
  $('q').value = '';
});
document.addEventListener('mouseup', (e) => { if (e.button === 3 && stack.length) back(); });
$('body').addEventListener('scroll', Y2K.debounce(savePos, 150), { passive: true });
let railQueued = false;
$('body').addEventListener('scroll', () => { if (!railQueued) { railQueued = true; requestAnimationFrame(() => { railQueued = false; railSync(); }); } }, { passive: true });
window.addEventListener('resize', Y2K.debounce(railSync, 150));

/* Clicking an artist in the Library Selection panel searches for them here.
   playlist.html writes 'y2k:libSearch' = { q, t }; the storage event is the fast path, the poll a fallback. */
let lastSearchT = (safe(() => JSON.parse(localStorage.getItem('y2k:libSearch')), null) || {}).t || 0;
function checkLibSearch() {
  const r = safe(() => JSON.parse(localStorage.getItem('y2k:libSearch')), null);
  if (!r || !r.t || r.t <= lastSearchT) return;
  lastSearchT = r.t;
  if (trackCount) searchArtist(r.q);
}
window.addEventListener('storage', (e) => { if (e.key === 'y2k:libSearch') checkLibSearch(); });
setInterval(checkLibSearch, 600);

const reload = Y2K.debounce(load, 2500);
['library:itemsAdded', 'library:itemsRemoved', 'library:itemsModified'].forEach((ev) => fb2k.on(ev, reload));
document.addEventListener('dragover', (e) => e.preventDefault());
document.addEventListener('drop', (e) => e.preventDefault());
setTimeout(load, 30);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Metalheart Lyrics</title>
<link rel="stylesheet" href="common.css?v=22">
<style>
  /* Themed lyrics view. OpenLyrics stays the engine: it searches, downloads, saves and edits; this page reads what
     it saves (and .lrc files / lyric tags) and shows it, and the right-click menu runs OpenLyrics' own commands. */
  html, body { height: 100%; }
  body { overflow: hidden; padding: 0; --ls: 15px; }
  .stage { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 80%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 80%, transparent 100%); }
  .lines { position: absolute; left: 0; right: 0; top: 0; padding: 0 18px; text-align: center; transition: transform .55s cubic-bezier(.3,.7,.25,1); will-change: transform; }
  /* side padding: the current line is zoomed 1.12x after it has been wrapped, so every line wraps 12% narrower
     than the panel and a long line still fits once zoomed (it used to run off both sides) */
  .ln { padding: calc(var(--ls) * .32) 6%; font: 600 var(--ls)/1.3 var(--ui); color: var(--text-dim); opacity: .55; transition: opacity .35s, color .35s, transform .35s, text-shadow .35s; transform-origin: 50% 50%; }
  .ln.near { opacity: .8; color: var(--text); }
  .ln.past { opacity: .32; }
  .ln.gap { font-size: calc(var(--ls) * .8); letter-spacing: .4em; }
  .ln.cur { opacity: 1; transform: scale(1.12); font-weight: 800; color: rgb(var(--ceaffc4)); text-shadow: 0 0 10px var(--lime-glow); }
  /* the current line fills word by word as it is sung (--p per word: exact for word-synced files, paced otherwise) */
  .ln .w { font-style: inherit; }
  .ln.cur .w { background: linear-gradient(90deg, rgb(var(--cf4ffe0)) var(--p, 0%), var(--lime-2) var(--p, 0%)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .plain .ln { opacity: .85; color: var(--text); font-weight: 500; }
  .plain .lines { transition: none; }
  .msg { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center; padding: 20px;
    color: var(--text-dim); font: 400 8px/1.6 var(--pixel); letter-spacing: .12em; }
  .msg b { font: 900 22px/1.2 var(--display); color: var(--chrome-4); }
  .msg .scan { width: 120px; height: 3px; border-radius: 2px; background: rgba(var(--c9cff2e),.12); overflow: hidden; position: relative; }
  .msg .scan::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, transparent, var(--lime-2), transparent); animation: sc 1.1s linear infinite; }
  @keyframes sc { from { left: -40%; } to { left: 100%; } }
  .msg .row { display: flex; gap: 6px; margin-top: 6px; }
  .btn { height: 20px; padding: 0 9px; border-radius: 10px; cursor: pointer; display: inline-flex; align-items: center;
    font: 400 8px/1 var(--pixel); letter-spacing: .08em; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.5);
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.08) 50%, transparent 51%), linear-gradient(180deg, var(--blue-2), var(--blue-4)); border: 1px solid var(--blue-5); }
  .btn:hover { filter: brightness(1.15); }
  .badge { position: absolute; right: 8px; bottom: 6px; font: 400 7px/1 var(--pixel); letter-spacing: .12em; color: var(--text-dim); opacity: .6; pointer-events: none; }
  /* right-click menu */
  .menu { position: fixed; z-index: 10; min-width: 210px; padding: 4px; border-radius: 6px; background: linear-gradient(180deg, #1d2530, #11161d); border: 1px solid #000;
    box-shadow: 0 8px 22px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); font: 12px/1 var(--ui); color: #dbe4ee; }
  .menu .it { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .menu .it:hover { background: linear-gradient(180deg, var(--blue-2), var(--blue-4)); color: #fff; }
  .menu .it .k { margin-left: auto; font: 400 7px/1 var(--pixel); letter-spacing: .1em; color: var(--text-dim); }
  .menu .it.off { opacity: .4; pointer-events: none; }
  .menu .hd { padding: 6px 10px 4px; font: 400 7px/1 var(--pixel); letter-spacing: .14em; color: var(--lime-2); }
  .menu .sep { height: 1px; margin: 4px 6px; background: rgba(255,255,255,.08); }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="stage" id="stage"><div class="lines" id="lines"></div></div>
<div class="msg hidden" id="msg"></div>
<div class="badge" id="badge"></div>

<script>/* inside the Track Info panel this page runs in a frame: use the panel's connection to foobar2000 */
if (window.parent !== window) try { const P = window.parent; Object.defineProperty(window, 'chrome', { value: P.chrome, configurable: true, writable: true }); window.fb2k = P.fb2k; } catch (e) {}</script>
<script src="common.js?v=22"></script>
<script>
'use strict';
const { esc, safe, H } = Y2K;
const $ = (id) => document.getElementById(id);
const SEP = String.fromCharCode(30);
let cur = null, ly = { key: '', kind: 'none', lines: [], text: '', raw: '', src: '', since: 0, until: 0, next: 0 };
let pos = 0, posAt = 0, running = false, userScrollT = 0, plainY = 0;
let size = +safe(() => localStorage.getItem('lyrics:size'), 0) || 15, autoScroll = safe(() => localStorage.getItem('lyrics:auto'), '1') !== '0';
document.body.style.setProperty('--ls', size + 'px');

/* ---------------- reading lyrics: OpenLyrics' save folder, files next to the track, the track's tags ---------------- */
const parseLRC = Y2K.parseLRC; // plain + word-synced (enhanced) LRC, shared with the deck
const isSynced = (t) => /\[\d+:\d+(?:[.:]\d+)?\]/.test(t || '');
function readSources() {
  const base = Y2K.profileDir + '/lyrics/' + cur.lrcname;
  const found = [];
  for (const ext of ['.lrc', '.txt']) { const t = Y2K.readText(base + ext); if (t && t.trim()) found.push([t, 'OPENLYRICS']); }
  if (cur._local) {
    const names = [cur.filename.replace(/\.[^.]+$/, ''), cur.lrcname].filter(Boolean).map((s) => s.toLowerCase());
    for (const f of Y2K.listDir(cur._dirFwd)) {
      if (f.isDirectory || !/\.(lrc|txt)$/i.test(f.name) || !names.includes(f.name.replace(/\.(lrc|txt)$/i, '').toLowerCase())) continue;
      const t = Y2K.readText(cur._dirFwd + '/' + f.name); if (t && t.trim()) found.push([t, 'FILE']);
    }
  }
  const tags = safe(() => H.nowPlaying(['syncedlyrics', 'lyrics', 'unsyncedlyrics', 'unsynced lyrics', 'lyrics_synced'].map((n) => '$meta(' + n + ',0)').join('$char(30)')), '');
  for (const t of tags.split(SEP)) if (t && t.trim()) found.push([t, 'TAG']);
  return found.find(([t]) => isSynced(t)) || found[0] || null;
}
function load(force) {
  const now = Date.now();
  if (!cur || cur._src !== 'playing') { ly = { key: '', kind: 'none', lines: [], text: '', raw: '', src: '', since: 0, until: 0, next: 0 }; draw(); return; }
  const fresh = ly.key !== cur._key;
  if (fresh) ly = { key: cur._key, kind: 'none', lines: [], text: '', raw: '', src: '', since: now, until: now + 45000, next: 0 };
  if (!fresh && !force && now < ly.next) return;
  ly.next = now + (ly.kind === 'none' ? 1500 : 3000);           // keep watching: OpenLyrics may still be saving, or you edited them
  const f = readSources();
  if (!f) { if (fresh) draw(); return; }
  if (f[0] === ly.raw) return;
  ly.raw = f[0]; ly.src = f[1];
  if (isSynced(f[0])) { ly.kind = 'synced'; ly.lines = parseLRC(f[0]); }
  else { ly.kind = 'plain'; ly.lines = f[0].replace(/\r/g, '').split('\n').map((s) => ({ t: -1, s: s.trim() })); }
  // long instrumental breaks show a soft marker
  if (ly.kind === 'synced') {
    const L = [];
    ly.lines.forEach((l, i) => { L.push(l); const nx = ly.lines[i + 1]; if (nx && !l.s && nx.t - l.t > 6) l.s = '♪ ♪ ♪', l.gap = true; });
    if (L.length && L[0].t > 6) L.unshift({ t: 0, s: '♪ ♪ ♪', gap: true });
    ly.lines = L;
  }
  draw();
}

/* ---------------- drawing ---------------- */
let rows = [], curIdx = -2;
function draw() {
  const msg = $('msg'), lines = $('lines'), stage = $('stage');
  $('badge').textContent = ly.kind !== 'none' ? (ly.kind === 'synced' ? 'SYNCED' : 'UNSYNCED') + ' · ' + ly.src : '';
  if (!cur || cur._src !== 'playing') { lines.innerHTML = ''; rows = []; msg.innerHTML = '<b>NO SIGNAL</b>Lyrics show here while a track plays'; msg.classList.remove('hidden'); return; }
  if (ly.kind === 'none') {
    lines.innerHTML = ''; rows = [];
    msg.innerHTML = Date.now() < ly.until
      ? '<b>SEARCHING</b><div class="scan"></div>OpenLyrics is looking for the lyrics'
      : '<b>NO LYRICS</b>None found for this track<div class="row"><span class="btn" data-cmd="Search for lyrics">SEARCH AGAIN</span><span class="btn" data-cmd="Search for lyrics (manually)">SEARCH MANUALLY</span></div>';
    msg.classList.remove('hidden');
    msg.querySelectorAll('[data-cmd]').forEach((b) => { b.onclick = () => olCmd(b.dataset.cmd); });
    return;
  }
  msg.classList.add('hidden');
  stage.classList.toggle('plain', ly.kind === 'plain');
  const wordsOf = (l) => (l.w ? l.w.map((x) => x.s) : l.s.match(/\S+\s*/g) || []);
  lines.innerHTML = ly.lines.map((l) => '<div class="ln' + (l.gap ? ' gap' : '') + '">' +
    (ly.kind === 'synced' && !l.gap && l.s ? wordsOf(l).map((x) => '<i class="w">' + esc(x) + '</i>').join('') : esc(l.s) || '&nbsp;') + '</div>').join('');
  rows = [...lines.children]; curIdx = -2;
}
function tick() {
  requestAnimationFrame(tick);
  if (!rows.length) { if (ly.kind === 'none' && cur && cur._src === 'playing' && Date.now() > ly.until && !/NO LYRICS/.test($('msg').textContent)) draw(); return; }
  const t = pos + (running ? (performance.now() - posAt) / 1000 : 0), stage = $('stage'), lines = $('lines'), h = stage.clientHeight;
  const manual = performance.now() - userScrollT < 4000 || !autoScroll;
  if (ly.kind === 'synced') {
    let i = -1; for (let k = 0; k < ly.lines.length; k++) { if (ly.lines[k].t <= t + 0.08) i = k; else break; }
    if (i !== curIdx) {
      rows.forEach((r, k) => { r.classList.toggle('cur', k === i); r.classList.toggle('past', k < i); r.classList.toggle('near', k > i && k <= i + 2); });
      curIdx = i;
    }
    if (i >= 0) { // fill the current line's words up to where the song is
      const r = rows[i];
      if (!r._kw) { const l = ly.lines[i], nx = ly.lines.find((x) => x.t > l.t), ws = Y2K.lyricWords(l, nx ? nx.t : null), els = r.querySelectorAll('.w');
        r._kw = ws.length === els.length ? ws.map((w, k) => ({ el: els[k], t0: w.t0, t1: w.t1, p: -1 })) : []; }
      for (const w of r._kw) { const q = Math.round(Math.max(0, Math.min(1, (t - w.t0) / (w.t1 - w.t0))) * 200) / 2; if (q !== w.p) { w.p = q; w.el.style.setProperty('--p', q + '%'); } }
    }
    if (!manual) {
      const r = rows[Math.max(0, i)], y = r ? r.offsetTop + r.offsetHeight / 2 : 0;
      plainY = h * 0.42 - y; lines.style.transform = 'translateY(' + plainY.toFixed(1) + 'px)';
    }
  } else if (!manual) { // unsynced: scroll through the text over the length of the track
    const len = cur ? +cur.lengthsec || 0 : 0, f = len > 0 ? Math.min(1, Math.max(0, (t - 10) / Math.max(1, len - 25))) : 0;
    plainY = h * 0.3 - f * Math.max(0, lines.offsetHeight - h * 0.5); lines.style.transform = 'translateY(' + plainY.toFixed(1) + 'px)';
  }
}
// wheel: look around; the view snaps back to the current line a few seconds later
$('stage').addEventListener('wheel', (e) => {
  if (!rows.length) return;
  userScrollT = performance.now(); plainY -= e.deltaY * 0.6;
  const lines = $('lines'), h = $('stage').clientHeight; plainY = Math.min(h * 0.45, Math.max(h * 0.4 - lines.offsetHeight, plainY));
  lines.style.transition = 'none'; lines.style.transform = 'translateY(' + plainY + 'px)';
  clearTimeout(window.__wt); window.__wt = setTimeout(() => { lines.style.transition = ''; }, 120);
}, { passive: true });

/* ---------------- OpenLyrics commands (run on the playing track through foobar2000's context menu) ---------------- */
function olCmd(name) {
  if (!cur || !cur.path) return;
  Y2K.runFb2k('/context_command:"' + name + '" "' + cur.path + '"');
  if (/^Search|Edit|instrumental/.test(name)) { ly.until = Date.now() + 120000; ly.next = 0; if (ly.kind === 'none') draw(); }
}
const MENU = () => [
  ['hd', 'OPENLYRICS'],
  ['Search for lyrics', 'Search for lyrics', 'A new search with the normal settings'],
  ['Search for lyrics (manually)', 'Search manually…', 'Pick from every source, with your own search terms'],
  ['Edit lyrics', 'Edit lyrics…', 'Fix the words or the timing (the Sync line button sets a timestamp)'],
  ['Show lyrics', 'Show saved lyrics…'],
  ['Mark as instrumental', 'Mark as instrumental'],
  ['sep'],
  ['copy', 'Copy lyrics', '', ly.kind === 'none'],
  ['folder', 'Open the lyrics folder'],
  ['auto', (autoScroll ? '✓ ' : '') + 'Follow the song', 'Scroll with the music (off: scroll with the mouse wheel)'],
  ['bigger', 'Bigger text', 'A+'], ['smaller', 'Smaller text', 'A−'],
  ['sep'],
  ['prefs', 'OpenLyrics settings…', 'Opens foobar2000 Preferences: OpenLyrics is in the page list on the left'],
];
function openMenu(x, y) {
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu'; m.id = 'menu';
  m.innerHTML = MENU().map(([id, label, tip, off]) => id === 'sep' ? '<div class="sep"></div>' : id === 'hd' ? '<div class="hd">' + label + '</div>'
    : '<div class="it' + (off || (!cur || cur._src !== 'playing') && id !== 'bigger' && id !== 'smaller' && id !== 'auto' && id !== 'prefs' && id !== 'folder' ? ' off' : '') + '" data-id="' + esc(id) + '" title="' + esc(tip && tip.length > 3 ? tip : '') + '">' + esc(label) +
      (tip && tip.length <= 3 ? '<span class="k">' + esc(tip) + '</span>' : '') + '</div>').join('');
  document.body.appendChild(m);
  m.style.left = Math.min(x, innerWidth - m.offsetWidth - 4) + 'px'; m.style.top = Math.min(y, innerHeight - m.offsetHeight - 4) + 'px';
  m.querySelectorAll('.it').forEach((it) => { it.onclick = () => { closeMenu(); act(it.dataset.id); }; });
}
function closeMenu() { const m = $('menu'); if (m) m.remove(); }
function act(id) {
  if (id === 'copy') safe(() => navigator.clipboard.writeText(ly.kind === 'synced' ? ly.lines.filter((l) => !l.gap).map((l) => l.s).join('\n') : ly.raw));
  else if (id === 'folder') Y2K.openFile(Y2K.profileDir + '/lyrics');
  else if (id === 'auto') { autoScroll = !autoScroll; safe(() => localStorage.setItem('lyrics:auto', autoScroll ? '1' : '0')); }
  else if (id === 'bigger' || id === 'smaller') { size = Math.max(10, Math.min(30, size + (id === 'bigger' ? 1 : -1))); safe(() => localStorage.setItem('lyrics:size', size)); document.body.style.setProperty('--ls', size + 'px'); }
  else if (id === 'prefs') Y2K.runCommand('Preferences');
  else olCmd(id);
}
document.addEventListener('contextmenu', (e) => { e.preventDefault(); openMenu(e.clientX, e.clientY); });
document.addEventListener('mousedown', (e) => { if (!e.target.closest('.menu')) closeMenu(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

/* ---------------- wiring ---------------- */
function refresh() { cur = Y2K.getTrack(); load(false); }
function poll() {
  const playing = safe(() => H.isPlaying, false), paused = safe(() => H.isPaused, false);
  pos = playing ? safe(() => H.position, 0) : 0; posAt = performance.now(); running = playing && !paused;
  if (cur && cur._src === 'playing') load(false);
}
Y2K.onTrackContextChange(() => refresh());
setInterval(poll, 250);
refresh(); poll(); tick();
</script>
</body>
</html>
